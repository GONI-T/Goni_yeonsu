  async function showStaff() {
    if (!isMaster()) return authFrame({ code: 'AUTH_MASTER', message: '교직원 명단은 총괄 링크로만 고칠 수 있습니다. 내 연수의 대상자는 연수 현황 화면에서 더하거나 뺄 수 있습니다.' });
    loadingFrame('staff');
    try { A.staff = await Api.call('staff.list'); } catch (e) { return errorFrame(e, showStaff, 'staff'); }
    A.staffDirty = false;
    frame('<div class="a-pagehead"><div class="grow"><h1 class="a-h1 doc">교직원 명단</h1>' +
      '<p class="a-sub">새 연수를 만들 때 이 명단에서 대상자를 불러옵니다. 명단을 바꿔도 이미 만든 연수의 대상자와 등록부는 그대로입니다.</p></div>' +
      '<div class="a-actions"><button type="button" class="btn btn-secondary" data-act="paste">엑셀에서 붙여넣기</button>' +
      '<button type="button" class="btn btn-secondary" data-act="add">한 명 추가</button>' +
      '<button type="button" class="btn btn-primary" data-act="save" data-busy="저장하는 중…" aria-disabled="true">변경 내용 저장</button></div></div>' +
      '<div class="sheet table-scroll"><table class="ledger staff-table"><thead><tr><th class="c">연번</th><th>교과/업무</th><th>성명</th><th class="c" title="끄면 새 연수의 대상자에서 빠집니다">연수 대상</th><th class="c">순서</th><th><span class="sr-only">삭제</span></th></tr></thead><tbody id="stb"></tbody></table></div>' +
      '<p class="a-sub" style="margin-top:12px" id="staff-count"></p>', 'staff');
    renderStaff();
    var main = app.querySelector('.a-main');
    main.addEventListener('input', function (e) {
      var tr = e.target.closest('tr[data-i]');
      if (!tr) return;
      var i = +tr.getAttribute('data-i'), k = e.target.getAttribute('data-k');
      if (k === 'active') A.staff[i].active = e.target.checked; else A.staff[i][k] = e.target.value;
      dirty(true);
    });
    main.addEventListener('click', async function (e) {
      var t = e.target.closest('[data-act]');
      if (!t) return;
      var act = t.getAttribute('data-act'), tr = t.closest('tr[data-i]'), i = tr ? +tr.getAttribute('data-i') : -1;
      if (act === 'up' && i > 0) swap(i, i - 1);
      else if (act === 'down' && i < A.staff.length - 1) swap(i, i + 1);
      else if (act === 'del') { A.staff.splice(i, 1); dirty(true); renderStaff(); }
      else if (act === 'add') {
        A.staff.push({ id: '', dept: '', name: '', active: true }); dirty(true); renderStaff();
        var inputs = app.querySelectorAll('#stb tr:last-child input[type="text"]'); if (inputs[0]) inputs[0].focus();
      }
      else if (act === 'paste') pasteStaff();
      else if (act === 'save') saveStaff(t);
    });
  }

  function swap(a, b) {
    var t = A.staff[a]; A.staff[a] = A.staff[b]; A.staff[b] = t;
    dirty(true); renderStaff();
    var btn = app.querySelector('#stb tr[data-i="' + b + '"] [data-act="' + (b < a ? 'up' : 'down') + '"]');
    if (btn) btn.focus();
  }

  function dirty(v) {
    A.staffDirty = v;
    var b = app.querySelector('[data-act="save"]');
    if (b) b.setAttribute('aria-disabled', String(!v));
  }

  function renderStaff() {
    var tb = app.querySelector('#stb');
    tb.innerHTML = A.staff.map(function (p, i) {
      return '<tr data-i="' + i + '"><td class="ord num">' + (i + 1) + '</td>' +
        '<td><input type="text" data-k="dept" value="' + esc(p.dept) + '" aria-label="' + (i + 1) + '번 교과/업무" placeholder="교과/업무"></td>' +
        '<td><input type="text" data-k="name" value="' + esc(p.name) + '" aria-label="' + (i + 1) + '번 성명" placeholder="성명"></td>' +
        '<td class="c"><input type="checkbox" data-k="active"' + (p.active !== false ? ' checked' : '') + ' aria-label="' + esc(p.name) + ' 연수 대상"></td>' +
        '<td class="c" style="white-space:nowrap"><button type="button" class="icon-btn" data-act="up" aria-label="위로"' + (i === 0 ? ' disabled' : '') + '>↑</button>' +
        '<button type="button" class="icon-btn" data-act="down" aria-label="아래로"' + (i === A.staff.length - 1 ? ' disabled' : '') + '>↓</button></td>' +
        '<td class="c"><button type="button" class="icon-btn" data-act="del" aria-label="' + esc(p.name || (i + 1) + '번') + ' 삭제">×</button></td></tr>';
    }).join('') || '<tr><td colspan="6" class="muted" style="padding:28px;text-align:center">명단이 비어 있습니다. [엑셀에서 붙여넣기]로 한 번에 넣을 수 있습니다.</td></tr>';
    var active = A.staff.filter(function (p) { return p.active !== false; }).length;
    app.querySelector('#staff-count').textContent = '모두 ' + A.staff.length + '명, 연수 대상 ' + active + '명';
  }

  function parseStaff(text) {
    return text.split(/\r?\n/).map(function (line) {
      var parts = line.split(/\t|,|\s{2,}/).map(function (x) { return x.trim(); }).filter(Boolean);
      if (parts.length >= 3 && /^\d+$/.test(parts[0])) parts.shift();
      if (!parts.length) return null;
      if (/^(연번|교과|성명|이름)/.test(parts[0]) || /^(성명|이름)$/.test(parts[1] || '')) return null;
      return parts.length === 1 ? { dept: '', name: parts[0] } : { dept: parts[0], name: parts[1] };
    }).filter(Boolean);
  }

  function pasteStaff() {
    Y.modal({
      title: '엑셀에서 붙여넣기', wide: true,
      html: '<p style="margin-bottom:12px">엑셀이나 한글 표에서 <b>교과/업무</b>와 <b>성명</b> 두 열을 복사해 아래에 붙여넣으세요. 한 줄에 한 명씩 들어갑니다.</p>' +
        '<textarea id="paste-box" class="input" placeholder="국어&#9;강수진&#10;국어&#9;심진아&#10;…"></textarea>' +
        '<p class="help" id="paste-count" style="margin-top:6px"></p>' +
        '<div class="radio-line" style="margin-top:12px"><label><input type="radio" name="pm" value="replace" checked> 지금 명단을 모두 바꾸기</label>' +
        '<label><input type="radio" name="pm" value="append"> 아래에 이어 붙이기</label></div>',
      onOpen: function (m) {
        var box = m.el.querySelector('#paste-box');
        box.addEventListener('input', function () {
          var n = parseStaff(box.value).length;
          m.el.querySelector('#paste-count').textContent = n ? n + '명을 읽었습니다.' : '';
        });
      },
      actions: [{ label: '취소' }, {
        label: '명단에 넣기', kind: 'primary', onClick: function (m) {
          var list = parseStaff(m.el.querySelector('#paste-box').value);
          if (!list.length) throw new Error('읽은 이름이 없습니다. 교과/업무와 성명 두 열을 복사해 붙여넣어 주세요.');
          var mode = m.el.querySelector('input[name="pm"]:checked').value;
          var old = {};
          A.staff.forEach(function (p) { old[p.dept + '|' + p.name] = p.id; });
          var rows = list.map(function (p) { return { id: old[p.dept + '|' + p.name] || '', dept: p.dept, name: p.name, active: true }; });
          A.staff = mode === 'replace' ? rows : A.staff.concat(rows);
          dirty(true); renderStaff();
          Y.toast(list.length + '명을 넣었습니다. [변경 내용 저장]을 눌러야 저장됩니다.');
        }
      }]
    });
  }

  async function saveStaff(btn) {
    if (!A.staffDirty || btn.classList.contains('is-busy')) return;
    var empty = A.staff.filter(function (p) { return !String(p.name || '').trim(); }).length;
    if (empty && !(await Y.confirmBox({ title: '성명이 빈 줄이 ' + empty + '개 있습니다', body: '성명이 빈 줄은 빼고 저장합니다.', ok: '빼고 저장' }))) return;
    btn.classList.add('is-busy');
    await guard(async function () {
      A.staff = await Api.call('staff.save', { list: A.staff });
      dirty(false); renderStaff();
      Y.toast('명단을 저장했습니다.');
    });
    btn.classList.remove('is-busy');
  }

  /* ---------- 문서 전체 이벤트 ---------- */
  document.addEventListener('click', function (e) {
    var menu = app && app.querySelector('.menu:not(.row-menu)');
    if (menu && !menu.hidden && !e.target.closest('.menu-wrap')) toggleMenu(false);
    if (A.rowMenu && !e.target.closest('.row-menu') && e.target !== A.rowMenu.btn) closeRowMenu();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    var menu = app && app.querySelector('.menu:not(.row-menu)');
    if (menu && !menu.hidden) { toggleMenu(false); var b = app.querySelector('[data-act="more"]'); if (b) b.focus(); }
    if (A.rowMenu) { var rb = A.rowMenu.btn; closeRowMenu(); if (rb && rb.focus) rb.focus(); }
  });
  window.addEventListener('scroll', closeRowMenu, true);
  window.addEventListener('resize', closeRowMenu);
  global.addEventListener('beforeunload', function (e) {
    if (A.staffDirty && document.body.className === 'is-admin' && app && app.querySelector('#stb')) { e.preventDefault(); e.returnValue = ''; }
  });

  global.Admin = { mount: mount, enter: enter, stop: stop };
})(window);

/* 김포한가람중학교 연수 서명 — © 2026 김포한가람중학교 · 제작 JHK */
(function () {
  'use strict';
  var root = document.getElementById('app');
  function route() {
    var h = location.hash.replace(/^#/, '');
    if (/^(master-|new-|m-)/.test(h)) window.Admin.enter(root, h);
    else if (h.indexOf('admin') === 0) window.Admin.mount(root, h);
    else { window.Admin.stop(); window.Teacher.mount(root, h); }
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', route);
  route();
})();

</script>
</body>
